    <div class="tip">点击信封打开</div>

    <div class="envelope-wrap" id="envelope">
        <div class="envelope-flap"></div>
        <div class="envelope"></div>
        <div class="letter">
            <h3>展信佳</h3>
            <p>有些话藏了很久，</p>
            <p>终于决定以这样的方式告诉你。</p>
            <p>遇见你之后，平淡的日子都发着光。</p>
            <p>我喜欢你，不是一时兴起，</p>
            <p>是深思熟虑后，依然想走向你的心意。</p>
            <p class="sign">—— 写给特别的你</p>
        </div>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- 音乐开关按钮 -->
    <div class="music-btn" id="musicBtn" title="播放/暂停音乐">🎵</div>
